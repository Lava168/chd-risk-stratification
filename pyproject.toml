[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chd-risk-stratification"
version = "0.1.0"
description = "Prototype toolkit for community CHD risk stratification and closed-loop management."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Luodian CHD Risk Project" }
]
dependencies = []

[project.optional-dependencies]
ml = [
  "pandas>=2.0",
  "openpyxl>=3.1",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "lightgbm>=4.0",
  "shap>=0.45",
  "joblib>=1.3"
]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.0"
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5"
]
plots = [
  "matplotlib>=3.8",
  "seaborn>=0.13"
]

[project.scripts]
chd-risk = "chd_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
